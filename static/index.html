<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deadlock Lab | OS Simulator</title>
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/static/style.css?v=20261005_4">
</head>
<body>
    <div class="app-wrapper">
        <nav class="sidebar">
            <div class="sidebar-header">
                <h2><i class="fa-solid fa-microchip"></i> Deadlock Lab</h2>
                <button id="theme-toggle" class="icon-btn" title="Toggle Theme">
                    <i class="fa-solid fa-moon"></i>
                </button>
            </div>
            
            <div class="control-group">
                <label for="mode-select"><i class="fa-solid fa-sliders"></i> Mode</label>
                <select id="mode-select" class="modern-select">
                    <option value="static">Static (Matrix & RAG)</option>
                    <option value="simulation">Simulation (Tick-based)</option>
                </select>
                <div class="help-text" id="mode-help">Analyze a static snapshot of the system.</div>
            </div>
            
            <div class="control-group">
                <label for="scenario-select"><i class="fa-solid fa-folder-open"></i> Scenario</label>
                <select id="scenario-select" class="modern-select"></select>
            </div>

            <!-- Static Controls -->
            <div id="static-controls" class="mode-controls active">
                <button id="btn-detect" class="btn btn-primary">
                    <i class="fa-solid fa-magnifying-glass"></i> Detect Deadlock
                </button>
                <button id="btn-recover-auto" class="btn btn-success">
                    <i class="fa-solid fa-wand-magic-sparkles"></i> Auto Recover
                </button>
            </div>

            <!-- Sim Controls -->
            <div id="sim-controls" class="mode-controls">
                <label for="strategy-select"><i class="fa-solid fa-shield-heart"></i> Recovery Strategy</label>
                <select id="strategy-select" class="modern-select">
                    <option value="terminate_one" selected>Terminate One (Cost-based)</option>
                    <option value="none">Manual / No Auto-Recovery</option>
                    <option value="terminate_all">Terminate All</option>
                    <option value="preemption">Resource Preemption</option>
                </select>
                
                <div class="action-buttons">
                    <button id="btn-start" class="btn btn-primary w-100">
                        <i class="fa-solid fa-play"></i> Start Simulation
                    </button>
                </div>
                
                <div class="sim-playback">
                    <button id="btn-auto" class="btn btn-warning" title="Auto-Play Continuous Simulation">
                        <i class="fa-solid fa-forward"></i> Auto-Play
                    </button>
                    <button id="btn-step" class="btn btn-secondary" title="Step one tick">
                        <i class="fa-solid fa-forward-step"></i> Step
                    </button>
                </div>
            </div>
            
            <div class="divider"></div>
            
            <div class="control-group">
                <label><i class="fa-solid fa-user-doctor"></i> Manual Recovery</label>
                <select id="victim-select" class="modern-select" disabled style="margin-bottom: 10px;">
                    <option value="">No deadlocked processes</option>
                </select>
                <button id="btn-recover-manual" class="btn btn-warning" disabled>
                    <i class="fa-solid fa-skull"></i> Abort Victim
                </button>
            </div>
        </nav>

        <main class="main-content">
            <header class="top-bar">
                <div id="status-banner" class="status-banner safe">
                    <div class="status-icon"><i class="fa-solid fa-check-circle"></i></div>
                    <div class="status-text">
                        <span class="status-title">SYSTEM SAFE</span>
                        <span class="status-desc" id="status-desc">No deadlocks detected in current state.</span>
                    </div>
                </div>
            </header>

            <div class="visualization-area">
                <div class="panel graph-panel">
                    <div class="panel-header">
                        <h3>Resource Allocation Graph</h3>
                        <div class="legend">
                            <span class="legend-item"><span class="legend-color process-color"></span> Process</span>
                            <span class="legend-item"><span class="legend-color resource-color"></span> Resource</span>
                            <span class="legend-item"><span class="legend-color deadlock-color"></span> Deadlocked</span>
                        </div>
                    </div>
                    <div class="graph-container" id="graph-container">
                        <svg id="rag-svg"></svg>
                    </div>
                </div>
                
                <div class="panel data-panel">
                    <div class="tabs">
                        <button class="tab-btn active" data-tab="matrices">State Matrices</button>
                        <button class="tab-btn" data-tab="metrics">Metrics & Logs</button>
                    </div>
                    
                    <div class="tab-content active" id="tab-matrices">
                        <div class="matrix-grid">
                            <div class="matrix-box">
                                <h4>Available Resources</h4>
                                <table id="avail-table" class="data-table"></table>
                            </div>
                            <div class="matrix-box">
                                <h4>Current Allocation</h4>
                                <table id="alloc-table" class="data-table"></table>
                            </div>
                            <div class="matrix-box">
                                <h4>Pending Requests</h4>
                                <table id="req-table" class="data-table"></table>
                            </div>
                        </div>
                    </div>
                    
                    <div class="tab-content" id="tab-metrics">
                        <!-- Dedicated Simulation Toolbar inside Metrics & Logs -->
                        <div class="sim-toolbar">
                            <div class="sim-toolbar-buttons">
                                <button id="tab-btn-start" class="btn btn-primary btn-sm" title="Start / Restart Simulation">
                                    <i class="fa-solid fa-play"></i> Start
                                </button>
                                <button id="tab-btn-auto" class="btn btn-warning btn-sm" title="Auto-Play Simulation">
                                    <i class="fa-solid fa-forward"></i> Auto-Play
                                </button>
                                <button id="tab-btn-step" class="btn btn-secondary btn-sm" title="Advance by 1 Tick">
                                    <i class="fa-solid fa-forward-step"></i> Step
                                </button>
                                <button id="tab-btn-reset" class="btn btn-secondary btn-sm" title="Reset Simulation">
                                    <i class="fa-solid fa-rotate-left"></i> Reset
                                </button>
                            </div>
                            <div class="speed-box">
                                <label for="speed-select"><i class="fa-solid fa-gauge-high"></i> Speed:</label>
                                <select id="speed-select" class="speed-select">
                                    <option value="1200">0.5x</option>
                                    <option value="700" selected>1x</option>
                                    <option value="350">2x</option>
                                    <option value="150">4x</option>
                                </select>
                            </div>
                        </div>

                        <div class="metrics-grid" id="metrics-panel">
                            <div class="metric-card">
                                <div class="metric-value" id="val-tick">0</div>
                                <div class="metric-label">Tick</div>
                            </div>
                            <div class="metric-card">
                                <div class="metric-value" id="val-status">Ready</div>
                                <div class="metric-label">Status</div>
                            </div>
                            <div class="metric-card">
                                <div class="metric-value" id="val-completed">0 / 0</div>
                                <div class="metric-label">Completed</div>
                            </div>
                            <div class="metric-card">
                                <div class="metric-value" id="val-deadlocks">0</div>
                                <div class="metric-label">Deadlocks</div>
                            </div>
                        </div>

                        <div class="log-header-row">
                            <h4 class="log-title">Event Trace</h4>
                            <button id="btn-clear-logs" class="btn-text-sm" title="Clear Event Log">
                                <i class="fa-solid fa-trash-can"></i> Clear
                            </button>
                        </div>
                        <div id="event-log" class="log-viewer"></div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Modals -->
    <div id="alert-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modal-title">Notice</h3>
                <button class="close-btn">&times;</button>
            </div>
            <div class="modal-body">
                <p id="modal-msg"></p>
            </div>
            <div class="modal-footer">
                <button class="btn btn-primary close-btn-main">OK</button>
            </div>
        </div>
    </div>

    <script src="/static/theme.js?v=20261005_4"></script>
    <script src="/static/graph.js?v=20261005_4"></script>
    <script src="/static/app.js?v=20261005_4"></script>
</body>
</html>
